<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Detectives</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8e7;--card:#ffffff;--text:#2b2a33;--muted:#6b6a75;--road:#e3e0d6;--park:#9bd78f;--lake:#6ec1ee;--line:#b9b5a6;--accent:#ff7a3d;--good:#2e9b4e;--bad:#d64545;--hl:#ffe14d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d2230;--card:#2a3045;--text:#f3f1ea;--muted:#aab0c4;--road:#3b4158;--park:#2f6b3b;--lake:#2a7bb0;--line:#555c78;--accent:#ff9158;--good:#5fd283;--bad:#ff7b7b;--hl:#b99a00}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d2230;--card:#2a3045;--text:#f3f1ea;--muted:#aab0c4;--road:#3b4158;--park:#2f6b3b;--lake:#2a7bb0;--line:#555c78;--accent:#ff9158;--good:#5fd283;--bad:#ff7b7b;--hl:#b99a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:4px 0;font-size:1.7rem}
.remind{background:var(--card);border:3px dashed var(--accent);border-radius:14px;padding:8px 14px;max-width:560px;text-align:center;font-size:1.05rem;margin:6px 0}
.wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;width:100%;max-width:900px}
.mapbox{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px}
.ylab,.xlab{display:grid;font-weight:bold;color:var(--muted);text-align:center;font-size:.95rem}
.ylab{grid-template-rows:repeat(10,1fr);align-items:center;width:1.4rem}
.xlab{grid-column:2;grid-template-columns:repeat(10,1fr)}
.axisT{grid-column:2;text-align:center;font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);width:min(88vw,460px);aspect-ratio:1;grid-template-rows:repeat(10,1fr);border:3px solid var(--text);border-radius:6px;overflow:hidden;background:var(--road)}
.cell{min-width:0;min-height:0;overflow:hidden;line-height:1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4.6vw,26px);position:relative;cursor:pointer;user-select:none;padding:0}
.cell.park{background:var(--park)}
.cell.lake{background:var(--lake)}
.cell.hl{outline:4px solid var(--hl);outline-offset:-4px;background-image:linear-gradient(var(--hl),var(--hl));background-blend-mode:multiply;animation:pulse 0.8s infinite alternate}
.cell.ok{box-shadow:inset 0 0 0 4px var(--good)}
.cell.no{box-shadow:inset 0 0 0 4px var(--bad)}
@keyframes pulse{to{filter:brightness(1.2)}}
.label{position:absolute;bottom:0;left:0;right:0;font-size:.5rem;line-height:1;text-align:center;font-weight:bold;background:rgba(255,255,255,.7);color:#222}
.panel{background:var(--card);border-radius:16px;padding:16px;width:min(88vw,340px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.stars{font-size:1.4rem;letter-spacing:2px}
.q{font-size:1.3rem;margin:10px 0;min-height:4.2rem}
.ans{display:flex;align-items:center;gap:8px;font-size:2.2rem;font-weight:bold}input{font:inherit;font-size:1.8rem;width:100%;min-width:0;text-align:center;padding:8px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--text)}
button{font:inherit;font-size:1.2rem;font-weight:bold;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:10px 18px;cursor:pointer;margin-top:10px;width:100%}
button.alt{background:var(--muted)}
.msg{min-height:3.2rem;margin-top:8px;font-size:1.1rem;font-weight:bold}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.legend{font-size:.9rem;color:var(--muted);margin-top:8px}
.big{font-size:3rem;text-align:center}
</style>
</head>
<body>
<h1>🗺️ Map Detectives</h1>
<div class="remind">Go <b>across</b> first ➡️ (along the corridor), then <b>up</b> ⬆️ (up the stairs)!<br>Write it like this: <b>x,y</b> &nbsp;— the tree stump is at <b>6,9</b></div>
<div class="wrap">
  <div class="mapbox">
    <div class="ylab" id="ylab"></div>
    <div class="grid" id="grid"></div>
    <div class="xlab" id="xlab"></div>
    <div class="axisT">across ➡️</div>
  </div>
  <div class="panel">
    <div class="stars" id="stars"></div>
    <div class="q" id="q"></div>
    <div id="inputArea"><div class="ans"><input id="ax" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="➡️" aria-label="across number"><span>,</span><input id="ay" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="⬆️" aria-label="up number"></div><button id="go">Check ✔️</button></div>
    <div class="msg" id="msg"></div>
    <button class="alt" id="next" style="display:none">Next ➡️</button>
    <div class="legend">🏫 Oratory School<br>🚇 South Kensington Station<br>🌊 Serpentine lake<br>🚓 Police station<br>🪵 Tree stump</div>
  </div>
</div>
<script>
const F=[
 {name:"Oratory School",short:"Oratory School",e:"🏫",cells:[[3,1]]},
 {name:"South Kensington Station",short:"South Kensington Station",e:"🚇",cells:[[3,3]]},
 {name:"Hyde Park police station",short:"the police station",e:"🚓",cells:[[2,8]]},
 {name:"Serpentine lake",short:"the Serpentine lake",e:"🌊",cells:[[4,6],[5,6],[6,6]],icon:[5,6]},
 {name:"Tree stump",short:"the tree stump",e:"🪵",cells:[[6,9]]}
];
const trees=[[4,9],[5,8],[9,5],[2,6],[7,9],[8,6],[9,9],[4,4],[7,5],[1,5],[1,10]];
const grid=document.getElementById('grid'),cellEl={};
const key=(x,y)=>x+','+y;
for(let y=10;y>=1;y--)for(let x=1;x<=10;x++){
  const c=document.createElement('button');c.className='cell';c.style.cssText='margin:0;padding:0;min-width:0;min-height:0;overflow:hidden;line-height:1;width:auto;border-radius:0;font-weight:normal;color:inherit;background:var(--road)';
  c.setAttribute('aria-label','square '+x+','+y);
  if(y>=4)c.classList.add('park');
  cellEl[key(x,y)]=c;c.onclick=()=>clickCell(x,y);grid.appendChild(c);
}
Object.values(cellEl).forEach(c=>{if(c.classList.contains('park'))c.style.background='var(--park)'});
trees.forEach(([x,y])=>cellEl[key(x,y)].textContent='🌳');
F.forEach(f=>{
  f.cells.forEach(([x,y])=>{if(f.e==='🌊'){const c=cellEl[key(x,y)];c.style.background='var(--lake)';}});
  const [ix,iy]=f.icon||f.cells[0];const c=cellEl[key(ix,iy)];c.textContent=f.e;
});
// label fixing: park cells bg
document.getElementById('xlab').innerHTML=[...Array(10)].map((_,i)=>'<span>'+(i+1)+'</span>').join('');
document.getElementById('ylab').innerHTML=[...Array(10)].map((_,i)=>'<span>'+(10-i)+'</span>').join('');

let rounds=[],ri=0,score=0,tries=0,cur=null,done=false;
const $=id=>document.getElementById(id);
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function start(){
  const typed=shuffle(F).map(f=>({t:'type',f}));
  const clicks=shuffle(F).slice(0,3).map(f=>({t:'click',f}));
  const rnd=[];while(rnd.length<2){const x=1+Math.floor(Math.random()*10),y=1+Math.floor(Math.random()*10);if(x!==y)rnd.push({t:'click',x,y})}
  rounds=[...typed,...clicks.map(c=>({t:'click',x:c.f.cells[0][0],y:c.f.cells[0][1],f:c.f})),...rnd];
  ri=0;score=0;show();
}
function clear(){Object.values(cellEl).forEach(c=>c.classList.remove('hl','ok','no'))}
function show(){
  clear();done=false;tries=0;$('msg').textContent='';$('msg').className='msg';$('next').style.display='none';
  $('stars').textContent='⭐'.repeat(score)+'☆'.repeat(rounds.length-score);
  if(ri>=rounds.length){
    $('inputArea').style.display='none';
    $('q').innerHTML='<div class="big">'+(score>=rounds.length-1?'🏆':'🎉')+'</div>You got '+score+' out of '+rounds.length+' stars! Brilliant map reading!';
    $('next').style.display='';$('next').textContent='Play again 🔁';$('next').onclick=start;return;
  }
  cur=rounds[ri];
  if(cur.t==='type'){
    $('inputArea').style.display='';$('ax').value='';$('ay').value='';$('ax').focus();
    $('q').innerHTML='Where is <b>'+cur.f.short+'</b>? '+cur.f.e+'<br><small>Type the coordinates (across, then up)</small>';
  }else{
    $('inputArea').style.display='none';
    $('q').innerHTML='Tap the square at <b>'+cur.x+','+cur.y+'</b><br><small>Go across '+cur.x+', then up '+cur.y+'</small>';
  }
  $('next').onclick=()=>{ri++;show()};$('next').textContent='Next ➡️';
}
function finish(ok,text){
  done=true;if(ok)score++;
  $('msg').textContent=text;$('msg').className='msg '+(ok?'good':'bad');
  $('stars').textContent='⭐'.repeat(score)+'☆'.repeat(rounds.length-score);
  $('next').style.display='';
  if(ri===rounds.length-1)$('next').textContent='See my score 🏆';
}
function answerCells(){return cur.f&&cur.t==='type'?cur.f.cells:[[cur.x,cur.y]]}
$('go').onclick=check;$('ax').onkeydown=e=>{if(e.key==='Enter')$('ay').focus()};$('ay').onkeydown=e=>{if(e.key==='Enter')check()};
function check(){
  if(done||cur.t!=='type')return;
  const m=[0,$('ax').value.trim(),$('ay').value.trim()];
  if(!/^\d+$/.test(m[1])||!/^\d+$/.test(m[2])){$('msg').textContent='Type a number in both boxes.';$('msg').className='msg bad';return}
  const x=+m[1],y=+m[2],cells=cur.f.cells;
  if(cells.some(c=>c[0]===x&&c[1]===y)){
    cells.forEach(c=>cellEl[key(...c)].classList.add('ok'));
    finish(tries===0,'Yes! '+(cells.length>1?'The lake covers '+cells.map(c=>c.join(',')).join(' and ')+'. ':'')+'It’s at '+x+','+y+' 🎉');return;
  }
  tries++;
  const swapped=cells.some(c=>c[0]===y&&c[1]===x);
  if(tries>=2){
    cells.forEach(c=>cellEl[key(...c)].classList.add('hl'));
    const c=cells[Math.floor(cells.length/2)];
    finish(false,'Not this time! Go across '+c[0]+', then up '+c[1]+': it’s '+c[0]+','+c[1]+'.');
  }else{
    $('msg').className='msg bad';
    $('msg').textContent=swapped?'Careful! You went up first. Go ACROSS first, then up. Try again! 💪':'Not quite. Start at the bottom left, go across, then up. Try again! 💪';
  }
}
function clickCell(x,y){
  if(done||!cur||cur.t!=='click')return;
  if(x===cur.x&&y===cur.y){cellEl[key(x,y)].classList.add('ok');finish(tries===0,'Yes! That’s '+x+','+y+' 🎉');}
  else{
    tries++;cellEl[key(x,y)].classList.add('no');
    const you=x+','+y;
    if(tries>=2){cellEl[key(cur.x,cur.y)].classList.add('hl');finish(false,'Not this time. '+cur.x+','+cur.y+' is here: across '+cur.x+', up '+cur.y+'.');}
    else{$('msg').className='msg bad';$('msg').textContent='That was '+you+'. Go across '+cur.x+' first, then up '+cur.y+'. Try again!';}
  }
}
start();
</script>
</body>
</html>
